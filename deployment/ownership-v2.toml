schema_version = 2
installed_mode = "regular-files"
development_mode = "repository-symlinks-allowed"
runtime_source_independent = true
managed_deployment_provenance = "managed-deployment-provenance"
create_once_transaction_state = "create-once-transaction-state"
create_once_lifecycle_state = "create-once-lifecycle-state"
release_update_journal = "release-update-journal"
release_update_lock = "release-update-lock"
release_update_staging = "release-update-staging"
release_update_bootstrap = "release-update-bootstrap"
release_update_bootstrap_state = "release-update-bootstrap-state"
sddm_login_state = "sddm-login-state"

[[initializer]]
id = "xdg-user-directories"
kind = "external-command"
command = "xdg-user-dirs-update"
state_artifact = "xdg-user-directories"

[[initializer]]
id = "appearance-defaults"
kind = "artifact-command"
command_artifact = "appearance-command"
initialize_arguments = ["initialize-defaults"]
status_arguments = ["initialize-status"]
state_artifact = "appearance-preference"

[[initializer]]
id = "power-idle-defaults"
kind = "artifact-command"
command_artifact = "idle-command"
initialize_arguments = ["initialize-defaults"]
status_arguments = ["initialize-status"]
state_artifact = "power-idle-preference"

[[ownership_class]]
name = "VANILLA_MANAGED"
deployable = true
source_policy = "required"
install_action = "copy"
update_action = "replace-after-validation"

[[ownership_class]]
name = "VANILLA_MANAGED_SYSTEM"
deployable = true
source_policy = "required"
install_action = "copy-as-root"
update_action = "replace-after-validation"

[[ownership_class]]
name = "CREATE_ONCE_MACHINE"
deployable = true
source_policy = "required-when-implemented"
install_action = "create-if-absent"
update_action = "preserve"

[[ownership_class]]
name = "CREATE_ONCE_USER"
deployable = true
source_policy = "required-when-implemented"
install_action = "create-if-absent"
update_action = "preserve"

[[ownership_class]]
name = "USER_OWNED"
deployable = false
source_policy = "forbidden"
install_action = "observe-or-seed-through-owner"
update_action = "preserve"

[[ownership_class]]
name = "BACKEND_OWNED"
deployable = false
source_policy = "forbidden"
install_action = "initialize-through-backend"
update_action = "backend-migration-only"

[[ownership_class]]
name = "GENERATED"
deployable = false
source_policy = "forbidden"
install_action = "generate-through-backend"
update_action = "regenerate-through-backend"

[[ownership_class]]
name = "RUNTIME"
deployable = false
source_policy = "forbidden"
install_action = "never"
update_action = "never"

[[ownership_class]]
name = "PACKAGE_OWNED"
deployable = false
source_policy = "forbidden"
install_action = "install-package-only"
update_action = "package-manager"

[[ownership_class]]
name = "EXTERNAL_OWNED"
deployable = false
source_policy = "forbidden"
install_action = "ensure-directory-only"
update_action = "preserve"

[[ownership_class]]
name = "ADOPTED_PRIVILEGED"
deployable = true
source_policy = "required"
install_action = "explicit-adoption-with-backup"
update_action = "replace-only-if-previously-adopted"

[[ownership_class]]
name = "OPTIONAL_COMPONENT_PAYLOAD"
deployable = false
source_policy = "forbidden"
install_action = "component-manager-only"
update_action = "component-manager-only"

