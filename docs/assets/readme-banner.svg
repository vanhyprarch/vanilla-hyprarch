<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Vanilla HyprArch</title>
  <desc id="description">The official four-circle logo in yellow, orange, rust, and brown, beside the project name and the tagline: A curated desktop. A vanilla system.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2025"/>
      <stop offset="1" stop-color="#111419"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="960" height="260" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="260" fill="url(#background)"/>
    <path d="M818 -40 1038 180M766 -40 1038 232M714 -40 1038 284" fill="none" stroke="#fcda02" stroke-opacity=".06" stroke-width="22"/>
    <rect x=".5" y=".5" width="959" height="259" rx="21.5" fill="none" stroke="#d8d2bf" stroke-opacity=".12"/>
    <!-- The official mark is reproduced at a uniform scale, preserving its geometry. -->
    <g transform="translate(56 54) scale(.152)">
      <circle cx="500.000000000000" cy="500.000000000000" r="500.000000000000" fill="#FCDA02"/>
      <circle cx="567.788749270776" cy="567.788749270776" r="404.132231404959" fill="#F17902"/>
      <circle cx="665.381172789911" cy="665.381172789911" r="266.115702479339" fill="#BE5015"/>
      <circle cx="741.935708604323" cy="741.935708604323" r="157.851239669421" fill="#6D3523"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="248" y="73" fill="#fcda02" font-size="14" font-weight="700" letter-spacing=".7">A curated desktop. A vanilla system.</text>
      <text x="245" y="131" fill="#fff8e9" font-size="56" font-weight="700" letter-spacing="-2">Vanilla HyprArch</text>
      <text x="248" y="166" fill="#c5c4be" font-size="20">A focused desktop layer for Arch Linux.</text>
      <path d="M248 189h31" stroke="#f17902" stroke-width="3" stroke-linecap="round"/>
      <text x="293" y="193" fill="#a6aaa9" font-size="11" font-weight="700" letter-spacing="1.6">HYPRLAND / QUICKSHELL / SMALL COMPONENTS</text>
    </g>
  </g>
</svg>
