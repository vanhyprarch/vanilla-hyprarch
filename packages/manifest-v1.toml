schema_version = 1
architecture = "x86_64"

[policy]
official_repositories_preferred = true
aur_requires_explicit_approval = true
default_install_is_explicit = true
dependency_authority = "pacman"
versions_are_pinned = false

[aur]
approved_default = ["yay"]
build_as_root = false
bootstrap_official = ["base-devel", "git"]

[[component]]
id = "printing"
classification = "recommended"
default_install = false
manager_in_baseline = false
description = "Local printing and graphical printer administration."

[[component]]
id = "network-printing"
classification = "optional"
default_install = false
manager_in_baseline = false
requires = ["printing"]
description = "Network-printer discovery, kept separate from local printing."

[[component]]
id = "dictation"
classification = "optional"
default_install = false
manager_in_baseline = true
description = "Verified external Voxtype payload and Wayland text injection."

[[component]]
id = "zig-screensaver"
classification = "optional"
default_install = false
manager_in_baseline = true
external_payload = true
installed_compiler_required = false
description = "Pinned native player payload; the baseline ships only its manager."

[[component]]
id = "dictation-vulkan"
classification = "optional"
default_install = false
manager_in_baseline = true
requires = ["dictation"]
description = "Explicit hardware-validated Vulkan dictation variant; never selected automatically."

